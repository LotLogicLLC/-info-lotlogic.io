<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LotLogic | Previous Work</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

body {
margin: 0;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
color: #1f2933;
background: #f5f7fa;
line-height: 1.6;
}

/* ================= NAV ================= */

.nav {
background: #020617;
padding: 14px 24px;
}

.nav-container {
max-width: 1100px;
margin: 0 auto;
display: flex;
justify-content: space-between;
align-items: center;
}

.nav-logo {
color: #fff;
font-weight: 700;
text-decoration: none;
font-size: 20px;
}

.nav-links {
list-style: none;
display: flex;
gap: 30px;
margin: 0;
padding: 0;
}

.nav-links a {
color: #e5e7eb;
text-decoration: none;
font-weight: 500;
}

.nav-links a:hover {
color: #93c5fd;
}

/* ================= HEADER ================= */

header {
background: #0f172a;
color: #fff;
padding: 80px 24px;
text-align: center;
}

header h1 {
font-size: 36px;
margin-bottom: 12px;
}

header p {
max-width: 700px;
margin: 0 auto;
color: #cbd5e1;
}

/* ================= GALLERY ================= */

.container {
max-width: 1100px;
margin: 0 auto;
padding: 60px 24px;
}

.gallery-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 30px;
}

.gallery-item {
background: #fff;
border-radius: 10px;
overflow: hidden;
box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

.gallery-item img {
width: 100%;
display: block;
}

/* ================= FOOTER ================= */

footer {
background: #020617;
color: #94a3b8;
text-align: center;
padding: 30px 16px;
font-size: 14px;
}

footer a {
color: #93c5fd;
text-decoration: none;
}

/* ================= MOBILE ================= */

@media (max-width: 900px) {
.gallery-grid {
grid-template-columns: repeat(2, 1fr);
}
}

@media (max-width: 600px) {
.gallery-grid {
grid-template-columns: 1fr;
}
}
</style>
</head>

<body>

<!-- NAV -->
<nav class="nav">
<div class="nav-container">
<a href="index.html" class="nav-logo">LotLogic</a>
<ul class="nav-links">
<li><a href="index.html">Home</a></li>
<li><a href="gallery.html">Gallery</a></li>
<li><a href="index.html#contact">Get a Quote</a></li>
</ul>
</div>
</nav>

<!-- HEADER -->
<header>
<h1>Previous Work</h1>
<p>
Recent parking lot striping, sweeping, pressure washing,
and maintenance projects across the Denver metro area.
</p>
</header>

<!-- GALLERY -->
<div class="container">

<div class="gallery-grid">

<div class="gallery-item">
<img src="gallery-1.jpeg" alt="Parking lot striping">
</div>

<div class="gallery-item">
<img src="gallery-2.jpeg" alt="Parking lot sweeping">
</div>

<div class="gallery-item">
<img src="gallery-3.jpeg" alt="Pressure washing">
</div>

<div class="gallery-item">
<img src="gallery-4.jpeg" alt="Lot maintenance">
</div>

<div class="gallery-item">
<img src="gallery-5.jpeg" alt="ADA striping">
</div>

<div class="gallery-item">
<img src="gallery-6.jpeg" alt="Commercial parking lot">
</div>

</div>

</div>

<footer>
© LotLogic LLC · Denver, CO<br>
<a href="mailto:info@lotlogic.io">info@lotlogic.io</a>
</footer>

</body>
</html>
